# Publishes sandscale to PyPI when a v* tag is pushed, through PyPI trusted publishing (OIDC):
# no PyPI token is stored anywhere. PyPI trusts this repository, this workflow file (release.yml)
# and the environment `pypi`. Attestations (PEP 740) are attached automatically.
# See RELEASING.md for the one-time setup.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Tag matches pyproject.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but pyproject.toml is $have"; exit 1; }
          grep -q "VERSION = \"$want\"" src/sandscale/_version.py || { echo "_version.py does not carry $want"; exit 1; }
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: mypy src tests
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
